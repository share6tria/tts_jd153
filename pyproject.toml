[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "share6tria-tts_jd153"
version = "0.1.0"
description = "通过字符级与结构级特征识别语音合成工程师·回归集与线上样本的差分的痕迹，给出密度与命中位置"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "share6tria" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://share6tria.github.io"
Repository = "https://github.com/share6tria/tts_jd153"
Issues = "https://github.com/share6tria/tts_jd153/issues"

[project.scripts]
tts_jd153 = "tts_jd153:main"

[tool.setuptools]
py-modules = ["tts_jd153"]
